{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <h1 class="h4 fw-bold text-center">Create your account</h1>
        <p class="text-center text-muted small">Save addresses, track orders and get offers.</p>
        <form method="post">
          {% csrf_token %}
          {% include "partials/form_fields.html" %}
          <button class="btn btn-brand w-100 py-2" type="submit">Sign up</button>
        </form>
        <p class="text-center small mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
