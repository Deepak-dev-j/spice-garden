{% extends "base.html" %}
{% block title %}Menu{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="mb-3">
    <h1 class="h3 fw-bold mb-0">Our Menu</h1>
    <small class="text-muted">{{ items|length }} dishes found</small>
  </div>

  <form method="get" class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small fw-semibold" for="f-q">Search</label>
        <input id="f-q" class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Biryani, dosa…">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small fw-semibold" for="f-cat">Category</label>
        <select id="f-cat" name="category" class="form-select">
          <option value="">All</option>
          {% for cat in categories %}
            <option value="{{ cat.slug }}" {% if request.GET.category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small fw-semibold" for="f-veg">Type</label>
        <select id="f-veg" name="veg" class="form-select">
          <option value="">All</option>
          <option value="veg" {% if request.GET.veg == "veg" %}selected{% endif %}>Veg</option>
          <option value="nonveg" {% if request.GET.veg == "nonveg" %}selected{% endif %}>Non-veg</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small fw-semibold" for="f-price">Max price (₹)</label>
        <input id="f-price" type="number" min="0" name="max_price" class="form-control" value="{{ request.GET.max_price }}">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small fw-semibold" for="f-sort">Sort by</label>
        <select id="f-sort" name="sort" class="form-select">
          <option value="">Default</option>
          <option value="popular" {% if request.GET.sort == "popular" %}selected{% endif %}>Popular</option>
          <option value="rating" {% if request.GET.sort == "rating" %}selected{% endif %}>Top rated</option>
          <option value="price_asc" {% if request.GET.sort == "price_asc" %}selected{% endif %}>Price: low to high</option>
          <option value="price_desc" {% if request.GET.sort == "price_desc" %}selected{% endif %}>Price: high to low</option>
        </select>
      </div>
      <div class="col-md-1 d-grid">
        <button class="btn btn-brand" type="submit">Go</button>
      </div>
    </div>
  </form>

  <div class="row g-4">
    {% for item in items %}
      <div class="col-6 col-md-4 col-lg-3">{% include "partials/food_card.html" %}</div>
    {% empty %}
      <div class="col-12 text-center py-5">
        <p class="fs-5">No dishes match your filters.</p>
        <a href="{% url 'menu' %}" class="btn btn-outline-brand">Clear filters</a>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
